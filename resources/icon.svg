<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E26" />
      <stop offset="50%" stop-color="#090710" />
      <stop offset="100%" stop-color="#050408" />
    </linearGradient>

    <!-- Neon Purple Glow -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Cyan Cable Accent -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cableGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#2E244D" stroke-width="6" />

  <!-- Background Grid Dots -->
  <g fill="#372D5E" opacity="0.4">
    <circle cx="80" cy="80" r="4" />
    <circle cx="160" cy="80" r="4" />
    <circle cx="240" cy="80" r="4" />
    <circle cx="320" cy="80" r="4" />
    <circle cx="400" cy="80" r="4" />

    <circle cx="80" cy="160" r="4" />
    <circle cx="400" cy="160" r="4" />

    <circle cx="80" cy="360" r="4" />
    <circle cx="400" cy="360" r="4" />

    <circle cx="80" cy="440" r="4" />
    <circle cx="160" cy="440" r="4" />
    <circle cx="240" cy="440" r="4" />
    <circle cx="320" cy="440" r="4" />
    <circle cx="400" cy="440" r="4" />
  </g>

  <!-- Floating Holographic Nodes & Cables -->
  <!-- Cable Left to Head -->
  <path d="M 90 220 C 140 220, 160 280, 210 280" fill="none" stroke="url(#cableGrad)" stroke-width="6" stroke-linecap="round" filter="url(#cableGlow)" />
  <!-- Cable Right to Head -->
  <path d="M 420 230 C 370 230, 350 290, 302 290" fill="none" stroke="url(#cableGrad)" stroke-width="6" stroke-linecap="round" filter="url(#cableGlow)" />
  <!-- Cable Bottom Loop -->
  <path d="M 170 380 C 210 430, 300 430, 342 380" fill="none" stroke="url(#purpleGlow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6" opacity="0.8" filter="url(#cableGlow)" />

  <!-- Node Left -->
  <rect x="60" y="190" width="60" height="60" rx="16" fill="#1A1433" stroke="#8B5CF6" stroke-width="4" filter="url(#glow)" />
  <circle cx="90" cy="220" r="8" fill="#38BDF8" />

  <!-- Node Right -->
  <rect x="390" y="200" width="60" height="60" rx="16" fill="#1A1433" stroke="#A855F7" stroke-width="4" filter="url(#glow)" />
  <circle cx="420" cy="230" r="8" fill="#C084FC" />

  <!-- Cute Cyberpunk Robot Mascot Head -->
  <!-- Head Outer Body -->
  <rect x="160" y="170" width="192" height="160" rx="48" fill="#161228" stroke="url(#purpleGlow)" stroke-width="7" />

  <!-- Headphones / Ear Caps -->
  <rect x="136" y="210" width="24" height="80" rx="12" fill="#7C3AED" stroke="#C084FC" stroke-width="3" />
  <rect x="352" y="210" width="24" height="80" rx="12" fill="#7C3AED" stroke="#C084FC" stroke-width="3" />
  <!-- Headband -->
  <path d="M 148 210 C 148 130, 364 130, 364 210" fill="none" stroke="#6D28D9" stroke-width="8" stroke-linecap="round" />

  <!-- Robot Visor Screen -->
  <rect x="184" y="200" width="144" height="96" rx="28" fill="#0C0A17" stroke="#3B2D68" stroke-width="3" />

  <!-- Expressive Cute Eyes (Glowing Neon Purple / Magenta) -->
  <g filter="url(#glow)">
    <!-- Left Eye -->
    <ellipse cx="224" cy="244" rx="16" ry="22" fill="#A855F7" />
    <circle cx="228" cy="238" r="6" fill="#FFFFFF" />
    <circle cx="220" cy="254" r="3" fill="#E9D5FF" />

    <!-- Right Eye -->
    <ellipse cx="288" cy="244" rx="16" ry="22" fill="#A855F7" />
    <circle cx="292" cy="238" r="6" fill="#FFFFFF" />
    <circle cx="284" cy="254" r="3" fill="#E9D5FF" />

    <!-- Cute Blush Marks -->
    <ellipse cx="204" cy="272" rx="8" ry="4" fill="#EC4899" opacity="0.6" />
    <ellipse cx="308" cy="272" rx="8" ry="4" fill="#EC4899" opacity="0.6" />

    <!-- Smile -->
    <path d="M 246 270 Q 256 278, 266 270" fill="none" stroke="#C084FC" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Antenna with Glowing Orb -->
  <line x1="256" y1="170" x2="256" y2="124" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="116" r="14" fill="#C084FC" filter="url(#glow)" stroke="#FFFFFF" stroke-width="2" />
</svg>
