appId: com.agentcanvas.app
productName: AgentCanvas
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - resources/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'

linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Guilherme Barcelos
  icon: build/icons
  synopsis: Spatial AI Agent Canvas Workspace for Linux & Windows
  description: Spatial AI Agent Canvas Workspace connecting terminals, notes and portals with live inter-agent IPC
  executableArgs:
    - "--no-sandbox"

deb:
  afterInstall: build/deb/after-install.sh
  afterRemove: build/deb/after-remove.sh

win:
  target:
    - nsis
    - zip
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
